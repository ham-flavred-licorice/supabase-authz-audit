# For clients who have the author's permission to run this tool (see LICENSE).
# Starting point for YOUR app repository (one that uses the Supabase CLI).
# Copy to .github/workflows/authz-audit.yml and adjust the two user ids.
#
# Requirements in your repo:
#   - supabase/migrations/   your schema
#   - supabase/seed.sql      creates two test users and a few rows owned by each
#   - authz-audit.config.json (optional) accept rules, ownership overrides, rpc args
name: authz-audit
on:
  pull_request:
    paths:
      - supabase/**

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      USER_A: 11111111-1111-4111-8111-111111111111
      USER_B: 22222222-2222-4222-8222-222222222222
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
      - name: Start the local Supabase stack (applies migrations and seed.sql)
        run: supabase start
      - name: Cross-user authorization audit
        run: >
          npx --yes github:ham-flavred-licorice/supabase-authz-audit
          --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --user-a "$USER_A" --user-b "$USER_B"
          --out authz-audit-report
      - name: Show the report on the run page
        if: always()
        run: cat authz-audit-report/report.md >> "$GITHUB_STEP_SUMMARY"
